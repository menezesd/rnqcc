name: GCC Torture Smoke

on:
  workflow_dispatch:
    inputs:
      mode:
        description: gcc.c-torture subdirectory
        required: true
        default: execute
        type: choice
        options:
          - execute
          - compile
      start:
        description: First sorted test index
        required: true
        default: "0"
      limit:
        description: Number of sorted tests to try
        required: true
        default: "100000"
  schedule:
    - cron: "23 8 * * *"

jobs:
  smoke:
    name: GCC torture ${{ inputs.mode || 'execute' }} smoke
    runs-on: ubuntu-latest
    env:
      GCC_TORTURE_ROOT: /tmp/rnqcc-gcc-torture/gcc
      GCC_TORTURE_SUITE: /tmp/rnqcc-gcc-torture/gcc/gcc/testsuite/gcc.c-torture
      CI_ARTIFACT_DIR: target/ci-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build rnqcc
        run: cargo build

      - name: Fetch GCC torture corpus
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://github.com/gcc-mirror/gcc.git "$GCC_TORTURE_ROOT"
          git -C "$GCC_TORTURE_ROOT" sparse-checkout set --no-cone \
            /gcc/testsuite/gcc.c-torture \
            /gcc/testsuite/gcc.dg/20030309-1.c \
            /gcc/testsuite/gcc.dg/tree-ssa \
            /gcc/testsuite/gcc.dg/pr98304-1.c \
            /gcc/testsuite/gcc.target/powerpc/ppc-switch-2.c

      - name: Run GCC torture smoke
        run: |
          python3 scripts/gcc_torture_smoke.py \
            --suite "$GCC_TORTURE_SUITE" \
            --mode "${{ inputs.mode || 'execute' }}" \
            --start "${{ inputs.start || '0' }}" \
            --limit "${{ inputs.limit || '100000' }}" \
            --progress-every 100 \
            --expected-failures tests/fixtures/gcc_torture_expected_failures.txt \
            --allow-stale-expected-failures \
            --failure-log "$CI_ARTIFACT_DIR/gcc-torture-failures.txt" \
            --skip-log "$CI_ARTIFACT_DIR/gcc-torture-skips.txt" \
            --print-skips \
            --artifact-dir "$CI_ARTIFACT_DIR"

      - name: Check GCC torture expected failures
        if: always()
        run: |
          if [ -f "$CI_ARTIFACT_DIR/gcc-torture-failures.txt" ]; then
            report_args=(
              --expected tests/fixtures/gcc_torture_expected_failures.txt
              --fail-on-stale
              --fail-on-unexpected-xfail
              --fail-on-unmarked-expected
            )
            if [ "${{ inputs.start || '0' }}" = "0" ] && [ "${{ inputs.limit || '100000' }}" = "100000" ]; then
              report_args+=(--fail-on-absent-expected)
            fi
            python3 scripts/report_gcc_torture_xfails.py \
              "${report_args[@]}" \
              "$CI_ARTIFACT_DIR/gcc-torture-failures.txt"
          fi

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rnqcc-gcc-torture-smoke-artifacts
          path: target/ci-artifacts
          if-no-files-found: ignore
