name: GCC Torture Smoke

on:
  workflow_dispatch:
    inputs:
      mode:
        description: gcc.c-torture subdirectory
        required: true
        default: execute
        type: choice
        options:
          - execute
          - compile
      preprocessor:
        description: preprocessor mode
        required: true
        default: external
        type: choice
        options:
          - external
          - internal-cpp
      start:
        description: First sorted test index
        required: true
        default: "0"
      limit:
        description: Number of sorted tests to try
        required: true
        default: "100000"
      rnqcc_arg:
        description: Optional extra rnqcc argument, e.g. --fold-constants
        required: false
        default: ""
  schedule:
    - cron: "23 8 * * *"

jobs:
  smoke:
    name: GCC torture ${{ matrix.mode }} ${{ matrix.preprocessor }} smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: compile
            preprocessor: external
          - os: ubuntu-latest
            mode: execute
            preprocessor: external
          - os: ubuntu-latest
            mode: compile
            preprocessor: internal-cpp
          - os: ubuntu-latest
            mode: execute
            preprocessor: internal-cpp
          # GitHub's macos-latest runners are arm64, so these two jobs are the
          # only coverage aarch64-macos gets: the Ubuntu jobs above target
          # x86_64-linux, and run_tests.sh pins Darwin to x86_64-macos under
          # Rosetta. The preprocessor dimension is target-agnostic, so macOS
          # exercises the backend through the external preprocessor only.
          - os: macos-latest
            mode: compile
            preprocessor: external
          - os: macos-latest
            mode: execute
            preprocessor: external
    env:
      GCC_TORTURE_ROOT: /tmp/rnqcc-gcc-torture/gcc
      GCC_TORTURE_SUITE: /tmp/rnqcc-gcc-torture/gcc/gcc/testsuite/gcc.c-torture
      CI_ARTIFACT_DIR: target/ci-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build rnqcc
        run: cargo build --locked

      - name: Fetch GCC torture corpus
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://github.com/gcc-mirror/gcc.git "$GCC_TORTURE_ROOT"
          git -C "$GCC_TORTURE_ROOT" sparse-checkout set --no-cone \
            /gcc/testsuite/gcc.c-torture \
            /gcc/testsuite/gcc.dg/20030309-1.c \
            /gcc/testsuite/gcc.dg/tree-ssa \
            /gcc/testsuite/gcc.dg/pr98304-1.c \
            /gcc/testsuite/gcc.target/powerpc/ppc-switch-2.c

      - name: Run GCC torture smoke
        run: |
          cpp_args=()
          if [ "${{ matrix.preprocessor }}" = "internal-cpp" ]; then
            cpp_args+=(--internal-cpp)
          fi
          extra_rnqcc_args=()
          if [ -n "${{ inputs.rnqcc_arg || '' }}" ]; then
            extra_rnqcc_args+=(--rnqcc-arg="${{ inputs.rnqcc_arg }}")
          fi
          python3 scripts/gcc_torture_smoke.py \
            --suite "$GCC_TORTURE_SUITE" \
            --mode "${{ matrix.mode }}" \
            --start "${{ inputs.start || '0' }}" \
            --limit "${{ inputs.limit || '100000' }}" \
            --progress-every 100 \
            --expected-failures tests/fixtures/gcc_torture_expected_failures.txt \
            --expected-skips tests/fixtures/gcc_torture_expected_skips.txt \
            --allow-stale-expected-failures \
            "${cpp_args[@]}" \
            "${extra_rnqcc_args[@]}" \
            --failure-log "$CI_ARTIFACT_DIR/gcc-torture-failures.txt" \
            --skip-log "$CI_ARTIFACT_DIR/gcc-torture-skips.txt" \
            --print-skips \
            --artifact-dir "$CI_ARTIFACT_DIR"

      - name: Check GCC torture expected failures
        if: always()
        run: |
          if [ -f "$CI_ARTIFACT_DIR/gcc-torture-failures.txt" ]; then
            report_args=(
              --expected tests/fixtures/gcc_torture_expected_failures.txt
              --mode "${{ matrix.mode }}"
              --fail-on-stale
              --fail-on-unexpected-xfail
              --fail-on-unmarked-expected
            )
            if [ "${{ matrix.mode }}" = "execute" ] && [ "${{ inputs.start || '0' }}" = "0" ] && [ "${{ inputs.limit || '100000' }}" = "100000" ]; then
              report_args+=(--fail-on-absent-expected)
            fi
            python3 scripts/report_gcc_torture_xfails.py \
              "${report_args[@]}" \
              "$CI_ARTIFACT_DIR/gcc-torture-failures.txt"
          fi

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rnqcc-gcc-torture-${{ matrix.os }}-${{ matrix.mode }}-${{ matrix.preprocessor }}-artifacts
          path: target/ci-artifacts
          if-no-files-found: ignore
