name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test:
    name: Rust and compiler smoke tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Layout oracle
        run: python3 scripts/layout_oracle.py

      - name: Real project corpus
        run: python3 scripts/real_project_corpus.py
        env:
          CI_ARTIFACT_DIR: target/ci-artifacts

      - name: Real project smoke
        run: sh scripts/real_project_smoke.sh
        env:
          CI_ARTIFACT_DIR: target/ci-artifacts

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: rnqcc-ci-failure-artifacts-${{ matrix.os }}
          path: target/ci-artifacts
          if-no-files-found: ignore
